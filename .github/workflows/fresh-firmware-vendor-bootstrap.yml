name: Mist fresh-firmware vendor library bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-firmware-vendor-bootstrap.yml'
      - 'scripts/publish_mist_vendor_batch.py'

permissions:
  contents: read

concurrency:
  group: mist-fresh-vendor-bootstrap
  cancel-in-progress: false

jobs:
  fresh-firmware-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout copilot research tools
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare firmware extraction tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pigz zstd android-sdk-libsparse-utils erofs-utils golang-go
          python3 -m py_compile scripts/multicdn.py scripts/publish_mist_vendor_batch.py scripts/stage_vendor_sources.py
          df -h .
      - name: Download FULL fastboot firmware from verified Xiaomi CDN mirrors
        run: |
          set -euo pipefail
          mkdir -p work reports
          python3 -u scripts/multicdn.py
          test -s reports/firmware.md5
          grep -q 'c4450c4e168052ca9de1211306d3beff' reports/firmware.md5
      - name: Extract stock super partitions
        run: |
          set -euo pipefail
          mkdir -p work/unpacked
          pigz -dc work/*.tgz | tar -xf - -C work/unpacked
          rm -f work/*.tgz
          git clone -q https://github.com/soe1hom-arch/lpunpack-go.git work/lpunpack-src
          git -C work/lpunpack-src checkout --detach -q 073a3302a3c3ffae01633989e6dd1e60b6de15b7
          (cd work/lpunpack-src && CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/work/lpunpack" .)
          chmod +x work/lpunpack
          bash scripts/extract_partitions.sh
      - name: Stage verified stock vendor archive from mounted partitions
        run: |
          set -euo pipefail
          sudo python3 scripts/stage_vendor_sources.py
          test -s reports/stock-vendor-source.tar.zst
          (cd reports && sha256sum -c stock-vendor-source.sha256)
      - name: Generate ONLY curated 64-bit library batch
        run: |
          set -euo pipefail
          python3 scripts/publish_mist_vendor_batch.py \
            --archive reports/stock-vendor-source.tar.zst \
            --destination output/vendor \
            --report reports/mist-vendor-library-publication.json
          test -s output/vendor/Android.bp
          test "$(find output/vendor/proprietary/vendor/lib64 -maxdepth 1 -type f -name '*.so' | wc -l)" -eq 13
      - name: Publish review report from fresh firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-fresh-vendor-bootstrap-report
          path: |
            reports/firmware.md5
            reports/stock-vendor-source.sha256
            reports/mist-vendor-library-publication.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish exact allowlisted binaries and vendor build files to production main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'GH_PAT must be configured with vendor repo Contents write permission'; exit 1; }
          gh auth setup-git
          gh repo clone nobodyAtall-code/proprietary_vendor_xiaomi_mist output/production -- --quiet
          cd output/production
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -e Android.bp || test -e mist-vendor.mk; then
            echo 'Production vendor files already exist; refusing destructive replacement'
            exit 1
          fi
          cp -a ../vendor/. ./
          git add -- Android.bp mist-vendor.mk README.md proprietary/vendor/lib64/
          git diff --cached --check
          git commit -m "mist: publish 13 verified stock KeyMint shared libraries"
          git push origin HEAD:main
