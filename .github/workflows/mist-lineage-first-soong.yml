name: Mist LineageOS 23.2 first Soong configuration attempt

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mist-lineage-first-soong.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mist-lineage-first-soong
  cancel-in-progress: false

jobs:
  lineage-first-soong:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      DEBIAN_FRONTEND: noninteractive
      USE_CCACHE: "0"
      OUT_DIR: out
    steps:
      - name: Release hosted runner space and install source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq git git-lfs python3 curl rsync zip unzip zstd lz4 libxml2-utils
          git lfs install --skip-repo
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Checkout official LineageOS 23.2 source and resolve manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lineage"
          cd "$RUNNER_TEMP/lineage"
          "$HOME/bin/repo" init --depth=1 --no-repo-verify -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs
          "$HOME/bin/repo" sync -c --no-tags --no-clone-bundle --fail-fast -j4
          test -f build/envsetup.sh
          test -f vendor/lineage/vars/aosp_target_release
          grep -Fx 'aosp_target_release=bp4a' vendor/lineage/vars/aosp_target_release
          df -h .
      - name: Integrate actual production main trees in disposable source checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lineage"
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/android_device_xiaomi_mist.git device/xiaomi/mist
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/proprietary_vendor_xiaomi_mist.git vendor/xiaomi/mist
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/android_device_xiaomi_mist-kernel.git device/xiaomi/mist-kernel
          for path in device/xiaomi/mist vendor/xiaomi/mist device/xiaomi/mist-kernel; do
            echo "$path: $(git -C "$path" rev-parse HEAD)"
          done
          test -s device/xiaomi/mist-kernel/kernel
          test -f device/xiaomi/mist/BoardConfig.mk
          test -f vendor/xiaomi/mist/Android.bp
      - name: Execute first real LineageOS 23.2 lunch and Soong configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lineage"
          source build/envsetup.sh
          lunch lineage_mist-bp4a-userdebug
          # Builds the build-system configuration and Soong graph, NOT a flashable ROM.
          m -j2 nothing
          echo "First Soong configuration completed; full ROM, VINTF and boot still unverified" >> "$GITHUB_STEP_SUMMARY"
