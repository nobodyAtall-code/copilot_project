name: Mist LineageOS 23.2 first Soong configuration attempt

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mist-lineage-first-soong.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mist-lineage-first-soong
  cancel-in-progress: false

jobs:
  lineage-first-soong:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      DEBIAN_FRONTEND: noninteractive
      USE_CCACHE: "0"
      OUT_DIR: out
    steps:
      - name: Release hosted runner space and install source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq git git-lfs python3 curl rsync zip unzip zstd lz4 libxml2-utils
          git lfs install --skip-repo
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Checkout official LineageOS 23.2 source and resolve manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lineage"
          cd "$RUNNER_TEMP/lineage"
          echo "Source checkout disk availability before init:" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Starting official LineageOS 23.2 manifest init"
          "$HOME/bin/repo" init --depth=1 --no-repo-verify -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs
          echo "Manifest initialized; starting bounded source synchronization"
          # Limit simultaneous network/checkout operations to reduce peak load.
          # Capture the sync output so a failure has actionable logs without
          # needing redirected GitHub job-log storage.
          set +e
          "$HOME/bin/repo" sync -c --no-tags --no-clone-bundle --fail-fast -j2 --jobs-network=2 --jobs-checkout=2 2>&1 | tee "$RUNNER_TEMP/mist-lineage-repo-sync.log"
          sync_rc=${PIPESTATUS[0]}
          set -e
          if (( sync_rc != 0 )); then
            echo "LineageOS repo sync failed with exit code $sync_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Disk availability on failure:" | tee -a "$GITHUB_STEP_SUMMARY"
            df -h . | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Last 100 lines of repo sync output:"
            tail -n 100 "$RUNNER_TEMP/mist-lineage-repo-sync.log" || true
            echo "Repo sync error summaries (bounded):"
            find .repo -path '*/.git/logs/*' -prune -o -type f \\( -name '*.log' -o -name '*error*' \\) -print 2>/dev/null | head -n 20 || true
            exit "$sync_rc"
          fi
          test -f build/envsetup.sh
          test -f vendor/lineage/vars/aosp_target_release
          grep -Fx 'aosp_target_release=bp4a' vendor/lineage/vars/aosp_target_release
          df -h .
      - name: Integrate actual production main trees in disposable source checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lineage"
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/android_device_xiaomi_mist.git device/xiaomi/mist
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/proprietary_vendor_xiaomi_mist.git vendor/xiaomi/mist
          git clone --depth=1 --branch main https://github.com/nobodyAtall-code/android_device_xiaomi_mist-kernel.git device/xiaomi/mist-kernel
          for path in device/xiaomi/mist vendor/xiaomi/mist device/xiaomi/mist-kernel; do
            echo "$path: $(git -C "$path" rev-parse HEAD)"
          done
          test -s device/xiaomi/mist-kernel/kernel
          test -f device/xiaomi/mist/BoardConfig.mk
          test -f vendor/xiaomi/mist/Android.bp
          # Exact minimum landed-production commits; avoid stale cached trees.
          git -C vendor/xiaomi/mist merge-base --is-ancestor 2d2f1be HEAD
          git -C device/xiaomi/mist merge-base --is-ancestor adc7a1a HEAD
          for module in mist_hal_keymint_service_qti mist_hal_qseecomd mist_stock_core_camera mist_stock_core_sensors mist_stock_core_composer mist_stock_core_lights mist_stock_core_vibrator; do
            grep -q "$module" vendor/xiaomi/mist/mist-vendor.mk || { echo "Missing new HAL module: $module"; exit 1; }
          done
          test -s device/xiaomi/mist-kernel/vendor_boot.img
          test -s device/xiaomi/mist-kernel/dtbo.img
      - name: Execute first real LineageOS 23.2 lunch and Soong configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lineage"
          source build/envsetup.sh
          lunch lineage_mist-bp4a-userdebug
          # Builds the build-system configuration and Soong graph, NOT a flashable ROM.
          set +e
          m -j2 nothing 2>&1 | tee "$RUNNER_TEMP/mist-latest-soong.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          echo "Latest device/vendor configuration build exit: $build_rc" >> "$GITHUB_STEP_SUMMARY"
          if (( build_rc != 0 )); then
            echo "Last 150 configuration lines:"
            tail -n 150 "$RUNNER_TEMP/mist-latest-soong.log"
            exit "$build_rc"
          fi
          echo "Latest production HAL Soong/Kati graph passed; full ROM, VINTF and boot still unverified" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded Soong build log for error triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-current-production-soong-log
          path: ${{ runner.temp }}/mist-latest-soong.log
          retention-days: 7
          if-no-files-found: warn

