name: Mist Global firmware acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Prepare tools and disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y aria2 pigz p7zip-full
          df -h .
      - name: Download official Global fastboot ROM (16 connections)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work reports
          FILE="mist_global_images_OS3.0.304.0.WPUMIXM_20260917.0000.00_16.0_global_c4450c4e16.tgz"
          URL="https://bigota.d.miui.com/OS3.0.304.0.WPUMIXM/$FILE"
          aria2c --continue=true --max-connection-per-server=16 --split=16 --min-split-size=1M --file-allocation=none --max-tries=10 --retry-wait=10 --timeout=60 --dir=work --out="$FILE" "$URL"
          echo "c4450c4e168052ca9de1211306d3beff  work/$FILE" | md5sum --check
          sha256sum "work/$FILE" > reports/firmware.sha256
          printf 'source=%s\nversion=OS3.0.304.0.WPUMIXM\nregion=Global\nmd5=c4450c4e168052ca9de1211306d3beff\n' "$URL" > reports/source.txt
      - name: Extract archive and inventory images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/unpacked
          tar -xzf work/*.tgz -C work/unpacked
          find work/unpacked -type f -printf '%P\t%s bytes\n' | sort > reports/archive-files.tsv
          find work/unpacked -type f -name '*.img' -printf '%P\t%s bytes\n' | sort > reports/images.tsv
          find work/unpacked -type f -name '*.img' -print0 | xargs -0 -r sha256sum > reports/images.sha256
          df -h . > reports/disk-usage.txt
          test -s reports/images.tsv
      - name: Upload verified acquisition reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-global-OS3.0.304.0-acquisition
          path: reports/
          if-no-files-found: warn
          retention-days: 14
