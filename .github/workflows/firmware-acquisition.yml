name: Mist Global firmware acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4

      - name: Prepare extraction tools and disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pigz
          df -h .

      - name: Download firmware from six CDNs using sixteen parallel byte-range workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work reports
          python3 -m py_compile scripts/multicdn.py
          python3 -u scripts/multicdn.py
          sha256sum work/*.tgz > reports/firmware.sha256

      - name: Extract archive and inventory images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/unpacked
          pigz -dc work/*.tgz | tar -xf - -C work/unpacked
          find work/unpacked -type f -printf '%P\\t%s bytes\\n' | sort > reports/archive-files.tsv
          find work/unpacked -type f -name '*.img' -printf '%P\\t%s bytes\\n' | sort > reports/images.tsv
          find work/unpacked -type f -name '*.img' -print0 | xargs -0 -r sha256sum > reports/images.sha256
          df -h . > reports/disk-usage.txt
          test -s reports/images.tsv

      - name: Upload acquisition reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-global-OS3.0.304.0-acquisition
          path: reports/
          if-no-files-found: warn
          retention-days: 14
