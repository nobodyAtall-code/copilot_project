name: Mist first pinned Kleaf kernel compile attempt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mist-kleaf-first-compile.yml'
permissions:
  contents: read
concurrency:
  group: mist-first-kleaf-compile
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Configure host and Git identity
        run: |
          set -euo pipefail
          git config --global user.name "nobodyAtall-code"
          git config --global user.email "hashyofficial@gmail.com"
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl python3 python3-pip unzip zip rsync bc bison flex libssl-dev libelf-dev build-essential
          git lfs install
      - name: Assemble Android 15 / Linux 6.6 Kleaf dependency workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mist-kleaf"
          cd "$RUNNER_TEMP/mist-kleaf"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          install -m 755 repo "$RUNNER_TEMP/repo"
          export PATH="$RUNNER_TEMP:$PATH"
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 --partial-clone --no-repo-verify
          git -C .repo/manifests reset --hard 1863b57ae47bf254a3a08d21ba6c8c2ac13ff239
          echo "Using pinned Google kernel manifest $(git -C .repo/manifests rev-parse HEAD)"
          repo sync -c -j 12 --no-tags --fail-fast --optimized-fetch
          test -d build/kernel
          test -d common
          test -d prebuilts/clang/host/linux-x86
          test -f build/bazel_common_rules/dist/dist.bzl
          df -h .
      - name: Overlay exact pinned Xiaomi sources in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mist-kleaf"
          python3 - "${GITHUB_WORKSPACE}/research/micode-mist-w-oss-source-lock.json" <<'PY'
          import json,subprocess,sys,os,shutil,pathlib
          lock=json.load(open(sys.argv[1]))
          expected={x['repo']:x['sha'] for x in lock['sources']}
          specs=[
            ('nobodyAtall-code/kernel_build','build/kernel'),
            ('nobodyAtall-code/android_kernel_xiaomi_mist','msm-kernel'),
            ('MiCode/kernel_devicetree','_mist_extra/kernel_devicetree'),
            ('MiCode/vendor_qcom_opensource_wlan','_mist_extra/vendor_qcom_opensource_wlan'),
            ('MiCode/vendor_qcom_opensource_audio-kernel','_mist_extra/vendor_qcom_opensource_audio-kernel'),
            ('MiCode/vendor_qcom_opensource_data-kernel','_mist_extra/vendor_qcom_opensource_data-kernel'),
            ('MiCode/vendor_qcom_opensource_camera-kernel','_mist_extra/vendor_qcom_opensource_camera-kernel'),
            ('MiCode/vendor_qcom_proprietary_display-devicetree','_mist_extra/vendor_qcom_proprietary_display-devicetree'),
            ('MiCode/vendor_qcom_proprietary_camera-devicetree','_mist_extra/vendor_qcom_proprietary_camera-devicetree'),
          ]
          for remote,dest in specs:
            path=pathlib.Path(dest)
            # No production checkout is ever touched: this workspace is under RUNNER_TEMP.
            if path.exists(): shutil.rmtree(path)
            path.parent.mkdir(parents=True,exist_ok=True)
            url='https://github.com/'+remote+'.git'
            subprocess.run(['git','clone','--filter=blob:none','--no-checkout',url,dest],check=True)
            subprocess.run(['git','-C',dest,'checkout','--detach',expected[remote]],check=True)
            got=subprocess.check_output(['git','-C',dest,'rev-parse','HEAD'],text=True).strip()
            assert got==expected[remote],(remote,got,expected[remote])
            print('PIN',remote,got,flush=True)
          source=pathlib.Path('_mist_extra/kernel_devicetree')
          dest=pathlib.Path('msm-kernel/arch/arm64/boot/dts/vendor')
          dest.mkdir(parents=True,exist_ok=True)
          shutil.copytree(source,dest,dirs_exist_ok=True,ignore=shutil.ignore_patterns('.git'))
          # Map vendor kernel trees to the directory layout expected by Qualcomm build rules.
          mappings={
            'vendor_qcom_opensource_wlan':'vendor/qcom/opensource/wlan',
            'vendor_qcom_opensource_audio-kernel':'vendor/qcom/opensource/audio-kernel',
            'vendor_qcom_opensource_data-kernel':'vendor/qcom/opensource/data-kernel',
            'vendor_qcom_opensource_camera-kernel':'vendor/qcom/opensource/camera-kernel',
            'vendor_qcom_proprietary_display-devicetree':'vendor/qcom/proprietary/display-devicetree',
            'vendor_qcom_proprietary_camera-devicetree':'vendor/qcom/proprietary/camera-devicetree',
          }
          for name,target in mappings.items():
            dst=pathlib.Path(target);dst.parent.mkdir(parents=True,exist_ok=True)
            if dst.is_symlink():dst.unlink()
            elif dst.exists():shutil.rmtree(dst)
            dst.symlink_to(pathlib.Path(os.path.relpath(pathlib.Path('_mist_extra')/name,dst.parent)))
          # Xiaomi's msm_platforms.bzl resolves //build:msm_kernel_extensions.bzl.
          # Keep this Bazel wiring in the disposable runner only.
          root_build=pathlib.Path('build')
          root_build.mkdir(exist_ok=True)
          src_ext=pathlib.Path('msm-kernel/msm_kernel_extensions.bzl')
          assert src_ext.is_file(), 'Pinned Xiaomi extension missing'
          shutil.copy2(src_ext,root_build/'msm_kernel_extensions.bzl')
          if not (root_build/'BUILD.bazel').exists() and not (root_build/'BUILD').exists():
            (root_build/'BUILD.bazel').write_text('package(default_visibility = ["//visibility:public"])\\n')
          # DIAGNOSTIC-ONLY: public Xiaomi source points drivers/mihw to
          # unreleased vendor/xiaomi/proprietary/mihw. Do not fabricate code.
          # Stock mist_perf explicitly enables CONFIG_MIHW=y. Only for compiler
          # discovery, remove that setting in the DISPOSABLE runner clone.
          # This alters the effective device configuration; never ship outputs.
          kconfig=pathlib.Path('msm-kernel/drivers/Kconfig')
          required='source "drivers/mihw/Kconfig"'
          base=pathlib.Path('msm-kernel/arch/arm64/configs/gki_defconfig')
          perf=pathlib.Path('msm-kernel/arch/arm64/configs/vendor/mist_perf.config')
          assert base.is_file() and perf.is_file(), 'Required kernel config missing'
          assert not any(line.strip().startswith('CONFIG_MIHW=') for line in base.read_text().splitlines()), 'Unexpected GKI MIHW override'
          perf_text=perf.read_text()
          assert perf_text.splitlines().count('CONFIG_MIHW=y')==1, 'Unexpected mist_perf MIHW configuration'
          assert sum(line.strip().startswith('CONFIG_MIHW=') for line in perf_text.splitlines())==1, 'Multiple mist_perf MIHW overrides'
          # Missing proprietary MIHW Kconfig also prevents these five requested
          # Xiaomi symbols from surviving config merge (verified runs 43208679440 and 43209948183).
          # walt.c unconditionally includes missing MIHW mi_module.h under
          # CONFIG_METIS_WALT (verified run 43216970173), so omit that
          # exact diagnostic-only switch as well; never modify stock source.
          # MIGT_WALT references missing vendor-only types in walt.c under its
          # own #ifdef (run 43220236226); omit this exact switch too.
          # Fail closed if upstream values drift instead of silently stripping
          # arbitrary options. This is solely a non-flashable compiler probe.
          diagnostic_disabled={
            'CONFIG_MIHW':'y',
            'CONFIG_MI_SCHED':'m',
            'CONFIG_METIS':'m',
            'CONFIG_METIS_WALT':'y',
            'CONFIG_MIGT':'m',
            'CONFIG_MIGT_WALT':'y',
            'CONFIG_MI_SCHED_2_CLUSTER':'y',
            'CONFIG_MI_MID_DEVICE_OPT':'y',
          }
          lines=perf_text.splitlines(keepends=True)
          for symbol,value in diagnostic_disabled.items():
            exact=symbol+'='+value
            assert sum(line.strip()==exact for line in lines)==1, 'Unexpected source config: '+symbol
            assert sum(line.strip().startswith(symbol+'=') for line in lines)==1, 'Multiple source config assignments: '+symbol
            lines=[line for line in lines if line.strip()!=exact]
          perf.write_text(''.join(lines))
          print('DIAGNOSTIC-ONLY: removed exact unavailable MIHW-related config assignments '+','.join(diagnostic_disabled)+' from runner-only fragment; NEVER FLASH',flush=True)
          assert pathlib.Path('msm-kernel/drivers/mihw').is_symlink(), 'Unexpected MIHW layout'
          assert not pathlib.Path('vendor/xiaomi/proprietary/mihw/Kconfig').exists(), 'MIHW source now available; remove diagnostic workaround'
          content=kconfig.read_text()
          assert content.count(required)==1, 'Expected exactly one MIHW Kconfig include'
          kconfig.write_text(content.replace(required,'# DIAGNOSTIC ONLY: missing proprietary MIHW source (not boot validated)'))
          print('DIAGNOSTIC-ONLY: guarded unavailable MIHW Kconfig include; kernel output MUST NOT replace stock',flush=True)
          # DIAGNOSTIC ONLY: the original mist.bzl requests MIHW .ko files
          # even after disabling MIHW Kconfig. Remove only those exact
          # entries from the throwaway runner copy; preserve the real source.
          mist_bzl=pathlib.Path('msm-kernel/mist.bzl')
          bzl=mist_bzl.read_text()
          missing_modules=[
            'drivers/mihw/metis/metis.ko',
            'drivers/mihw/mi_sched/mi_schedule.ko',
            'drivers/mihw/game/migt.ko',
          ]
          for module in missing_modules:
            needle='"'+module+'",'
            assert bzl.count(needle)==1, 'Unexpected MIHW module entry: '+module
            bzl=bzl.replace(needle, '', 1)
          mist_bzl.write_text(bzl)
          assert not any('drivers/mihw/' in line and '.ko' in line for line in bzl.splitlines()), 'Unhandled MIHW module target'
          print('DIAGNOSTIC ONLY: stripped three MIHW module outputs from disposable mist.bzl; NEVER FLASH',flush=True)
          # DIAGNOSTIC SOURCE FIX: the radio cable status proc read returns a
          # small GPIO integer, but the Xiaomi source reserves PAGE_SIZE on
          # the stack (4176-byte frame; limit 2048; run 43556693565).
          # Preserve all other behavior and fail closed on source changes.
          rf_driver=pathlib.Path('msm-kernel/drivers/misc/radio_cable_det/radio_cable_det.c')
          rf_source=rf_driver.read_text()
          old='char out_buf[PAGE_SIZE];'
          new='char out_buf[16];'
          assert rf_source.count(old)==1, 'Unexpected radio cable stack buffer source'
          rf_driver.write_text(rf_source.replace(old,new,1))
          print('DIAGNOSTIC ONLY: radio cable status stack buffer PAGE_SIZE -> 16; source kernel repo unchanged',flush=True)
          print('Pinned Xiaomi sources and //build extension assembled',flush=True)
          PY
      - name: Query and attempt real Mist Bazel compilation
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/mist-kleaf"
          mkdir -p "$GITHUB_WORKSPACE/research/generated"
          LOG="$GITHUB_WORKSPACE/research/generated/mist-kleaf-first-compile.log"
          RESULT="$GITHUB_WORKSPACE/research/generated/mist-kleaf-first-compile-result.json"
          exec > >(tee "$LOG") 2>&1
          echo "=== Actual Bazel target discovery ==="
          if [[ -x tools/bazel ]]; then BAZEL=tools/bazel
          elif [[ -x build/kernel/kleaf/bazel.sh ]]; then BAZEL=build/kernel/kleaf/bazel.sh
          else echo 'No runnable Kleaf Bazel launcher found'; exit 20; fi
          "$BAZEL" query '//msm-kernel:all' --output=label | grep -E '^//msm-kernel:mist_(perf|consolidate)$'
          query_rc=$?
          echo "BAZEL_QUERY_EXIT=$query_rc"
          if [[ "$query_rc" -ne 0 ]]; then exit "$query_rc"; fi
          echo "=== Actual Mist kernel build attempt ==="
          "$BAZEL" build //msm-kernel:mist_perf --define=FACTORY_BUILD=0 --verbose_failures
          build_rc=$?
          echo "BAZEL_BUILD_EXIT=$build_rc"
          python3 - "$RESULT" "$query_rc" "$build_rc" <<'PY'
          import json,sys
          json.dump(dict(query_exit=int(sys.argv[2]),build_exit=int(sys.argv[3]),experimental_kernel_compiled=int(sys.argv[3])==0,kernel_compiled=False,diagnostic_missing_mihw_guard=True,validated_stock_abi=False,boot_tested=False),open(sys.argv[1],'w'),indent=2)
          PY
          exit "$build_rc"
      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-first-kleaf-compile-diagnostics
          path: |
            research/generated/mist-kleaf-first-compile.log
            research/generated/mist-kleaf-first-compile-result.json
          if-no-files-found: warn
          retention-days: 14
